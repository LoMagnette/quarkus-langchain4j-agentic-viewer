# Integration test configuration

# The OpenAI provider is only on the classpath as a workaround (see pom.xml): disable it,
# all agents use the scripted fake chat model and no API key is needed.
quarkus.langchain4j.openai.enable-integration=false

# Real model instead of the scripted fake: mvn quarkus:dev -pl integration-tests -Dquarkus.profile=dev,ollama
# Any OpenAI-compatible endpoint, by default a local Ollama; a tool-capable model is needed (BankSupervisor).
%ollama.quarkus.langchain4j.openai.enable-integration=true
%ollama.quarkus.langchain4j.openai.base-url=${OLLAMA_BASE_URL:http://localhost:11434/v1}
%ollama.quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:ollama}
%ollama.quarkus.langchain4j.openai.chat-model.model-name=${OLLAMA_MODEL:gemma4:e4b-mlx}
%ollama.quarkus.langchain4j.openai.chat-model.temperature=0
%ollama.quarkus.langchain4j.openai.timeout=180s
%ollama.quarkus.langchain4j.openai.log-requests=true
%ollama.quarkus.langchain4j.openai.log-responses=true

# Native build of the sample app (NativeArtifactIT): these quarkus-langchain4j holders read the CDI container in their
# static initializer, so they must not be initialized while the image is built (the OpenAI extension is only here as the
# workaround above, disabled)
quarkus.native.additional-build-args=--initialize-at-run-time=io.quarkiverse.langchain4j.openai.common.OpenAiRestApi$ObjectMapperHolder,\
  --initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$ObjectMapperHolder,\
  --initialize-at-run-time=io.quarkiverse.langchain4j.QuarkusJsonCodecFactory$SnakeCaseObjectMapperHolder

quarkus.langchain4j.agentic.dev-ui.builder-discovery=CDI
