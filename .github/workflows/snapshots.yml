name: langchain4j snapshots

# langchain4j-agentic and its patterns module are experimental and change often: build and test every night against
# their snapshots (profile langchain4j-snapshots), to learn about a breaking change before it is released
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  snapshots:
    name: Build and test against langchain4j snapshots (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        configuration: [ without-patterns, with-patterns ]
        include:
          - configuration: without-patterns
            profiles: "langchain4j-snapshots"
          - configuration: with-patterns
            profiles: "patterns,langchain4j-snapshots"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # the newest snapshot of the langchain4j BOM, not the one the profile names (it goes stale after each release)
      - name: Current langchain4j snapshot
        id: snapshot
        run: |
          version=$(curl -fsSL https://central.sonatype.com/repository/maven-snapshots/dev/langchain4j/langchain4j-bom/maven-metadata.xml \
            | grep -o '<version>[^<]*-SNAPSHOT</version>' | sed 's/<[^>]*>//g' | sort -V | tail -1)
          test -n "$version" || { echo "no langchain4j snapshot found"; exit 1; }
          echo "langchain4j snapshot: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # -U: the latest snapshots, not the cached ones
      - name: Build and test
        run: mvn -B -U clean install -P${{ matrix.profiles }} -Dlangchain4j.version=${{ steps.snapshot.outputs.version }}
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-test-reports-${{ matrix.configuration }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
