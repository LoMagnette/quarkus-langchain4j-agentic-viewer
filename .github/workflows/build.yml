name: Build

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # langchain4j-agentic-patterns is optional for applications: the extension must work with and without it
        configuration: [ without-patterns, with-patterns ]
        include:
          - configuration: without-patterns
            profiles: ""
          - configuration: with-patterns
            profiles: "-Ppatterns"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # samples and tests run on a scripted fake chat model: no API key needed
      - name: Build and test
        run: mvn -B clean install ${{ matrix.profiles }}
