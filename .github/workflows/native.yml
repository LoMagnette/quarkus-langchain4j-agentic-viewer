name: Native

# The production build must carry nothing of the Dev UI, native included (NativeArtifactIT), and the native sample app
# must start and run its agentic systems (ProdStartupIT): too slow for every pull request, run on main and weekly
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native build of the sample app
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build the extension
        run: mvn -B install -DskipTests
      # in a Mandrel container: no GraalVM on the runner
      - name: Native build and checks
        run: >-
          mvn -B verify -pl integration-tests -Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false
          -Dquarkus.native.container-build=true -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          '-Dit.test=NativeArtifactIT,ProdStartupIT'
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-reports
          path: integration-tests/target/failsafe-reports/
          retention-days: 7
